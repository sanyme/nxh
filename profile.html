<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — Nexoria Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    * { font-family: 'Inter', sans-serif; }
    [dir="rtl"] * { font-family: 'Tajawal', sans-serif; }

    .bg-grid {
      background-image:
        linear-gradient(rgba(0,200,224,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,224,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      transition: all 0.2s;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
    }
    .input-field:focus {
      outline: none;
      border-color: #00c8e0;
      background: rgba(0,200,224,0.05);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .input-field:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-cyan {
      background: #00c8e0;
      color: #000;
      font-weight: 700;
      transition: all 0.2s;
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
    .btn-cyan:hover {
      background: #00e5ff;
      box-shadow: 0 0 20px rgba(0,200,224,0.3);
    }
    .btn-cyan:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .avatar-wrapper { position: relative; display: inline-block; }
    .avatar-wrapper:hover .avatar-overlay { opacity: 1; }
    .avatar-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; cursor: pointer;
    }
    .tab-btn {
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,0.4);
      transition: all 0.2s;
      padding-bottom: 8px;
      background: none;
      border-top: none; border-left: none; border-right: none;
      cursor: pointer;
      font-size: 14px; font-weight: 700;
      padding-right: 4px; padding-left: 4px;
    }
    .tab-btn.active {
      border-bottom-color: #00c8e0;
      color: white;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.5s ease-out forwards; }

    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%,
                  rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
      height: 16px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen bg-grid">

  <nav id="mainNav"
       class="border-b border-white/10 px-8 py-4 flex items-center justify-between
              sticky top-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-md">
  </nav>
  <div id="mobileMenu" class="hidden md:hidden bg-[#0f0f0f] border-b border-white/10"></div>

  <div class="max-w-4xl mx-auto px-8 py-12 fade-in">

    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-4xl font-black mb-2">
        <span data-i18n="profile_title">My Profile</span>
        <span class="text-[#00c8e0]"> ✦</span>
      </h1>
      <p class="text-white/40 text-sm">Manage your account information</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <!-- ─── LEFT: Avatar Card ─── -->
      <div class="md:col-span-1">
        <div class="glass rounded-2xl p-6 text-center mb-6">

          <!-- Avatar -->
          <div class="flex justify-center mb-4">
            <div class="avatar-wrapper">
              <!-- Loaded avatar -->
              <img id="avatarImg" src="" alt="Avatar"
                   class="w-24 h-24 rounded-full object-cover
                          border-2 border-[#00c8e0]/50 hidden"/>
              <!-- Fallback initials -->
              <div id="avatarPlaceholder"
                   class="w-24 h-24 rounded-full bg-[#00c8e0]/20
                          border-2 border-[#00c8e0]/50
                          flex items-center justify-center
                          text-[#00c8e0] text-3xl font-black">
                ?
              </div>
              <!-- Hover overlay -->
              <div class="avatar-overlay"
                   onclick="document.getElementById('avatarInput').click()">
                <svg width="24" height="24" fill="none" stroke="white"
                     stroke-width="2" viewBox="0 0 24 24">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8
                           a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
              </div>
            </div>
          </div>

          <input type="file" id="avatarInput" accept="image/*"
                 class="hidden" onchange="handleAvatarUpload(event)"/>

          <button onclick="document.getElementById('avatarInput').click()"
                  class="text-xs text-[#00c8e0] hover:text-white
                         transition mb-4 block w-full"
                  data-i18n="profile_change_photo">Change Photo</button>

          <!-- Name / Username / Provider -->
          <div id="cardName"
               class="font-black text-lg mb-1 truncate">—</div>
          <div id="cardUsername"
               class="text-white/40 text-sm mb-3 truncate">—</div>
          <div id="cardProvider"
               class="text-xs px-3 py-1 rounded-full
                      bg-[#00c8e0]/10 text-[#00c8e0] inline-block
                      capitalize">—</div>

          <!-- Meta -->
          <div class="mt-6 pt-6 border-t border-white/10 text-left space-y-3">
            <div class="flex justify-between text-sm">
              <span class="text-white/40" data-i18n="profile_joined">Member Since</span>
              <span id="cardJoined" class="font-semibold text-xs">—</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-white/40">Email</span>
              <span id="cardEmail"
                    class="font-semibold text-xs truncate max-w-[130px]">—</span>
            </div>
          </div>
        </div>

        <!-- Danger Zone -->
        <div class="glass rounded-2xl p-6">
          <h3 class="font-bold text-red-400 mb-4"
              data-i18n="profile_danger">Danger Zone</h3>
          <button onclick="confirmDelete()"
                  class="w-full py-2 rounded-xl text-sm font-semibold
                         border border-red-500/30 text-red-400
                         hover:bg-red-500/10 transition"
                  data-i18n="profile_delete">Delete Account</button>
        </div>
      </div>

      <!-- ─── RIGHT: Edit Form ─── -->
      <div class="md:col-span-2">

        <!-- Tabs -->
        <div class="flex gap-6 mb-8 border-b border-white/10">
          <button onclick="switchProfileTab('info')"
                  id="ptab-info" class="tab-btn active">
            Account Info
          </button>
          <button onclick="switchProfileTab('purchases')"
                  id="ptab-purchases" class="tab-btn"
                  data-i18n="profile_purchases">My Purchases</button>
        </div>

        <!-- ── INFO TAB ── -->
        <div id="ptab-info-content">
          <form onsubmit="saveProfile(event)" class="flex flex-col gap-6">

            <div>
              <label class="text-xs text-white/40 font-semibold
                            tracking-widest mb-2 block"
                     data-i18n="profile_username">USERNAME</label>
              <input type="text" id="editUsername"
                     class="input-field" placeholder="Username"
                     minlength="3" required/>
            </div>

            <div>
              <label class="text-xs text-white/40 font-semibold
                            tracking-widest mb-2 block"
                     data-i18n="profile_name">DISPLAY NAME</label>
              <input type="text" id="editName"
                     class="input-field" placeholder="Display Name"/>
            </div>

            <div>
              <label class="text-xs text-white/40 font-semibold
                            tracking-widest mb-2 block"
                     data-i18n="profile_email">EMAIL</label>
              <input type="email" id="editEmail"
                     class="input-field" disabled/>
              <p class="text-xs text-white/30 mt-1">
                Email is managed by your OAuth provider
              </p>
            </div>

            <div class="pt-2">
              <button type="submit" id="saveBtn" class="btn-cyan"
                      data-i18n="profile_save">Save Changes</button>
            </div>

          </form>
        </div>

        <!-- ── PURCHASES TAB ── -->
        <div id="ptab-purchases-content" class="hidden">
          <div id="purchasesList"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-white/10 px-8 py-6 flex items-center
                 justify-between text-white/40 text-sm mt-12">
    <span data-i18n="footer_rights">© 2024 Nexoria Hub. All rights reserved.</span>
    <span class="text-[#00c8e0]/40 font-bold">NXH</span>
  </footer>

  <script src="shared.js"></script>
  <script>
    let currentUser = null;

    // ─── Init ───────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {

      // تحقق من اللوقين
      const loggedIn = await Auth.isLoggedIn();
      if (!loggedIn) {
        window.location.href = `${FRONTEND_URL}/login.html`;
        return;
      }

      // جيب بيانات اليوزر من Supabase
      currentUser = await Auth.getUser();
      console.log('User data:', currentUser); // للتشخيص

      if (!currentUser) {
        window.location.href = `${FRONTEND_URL}/login.html`;
        return;
      }

      loadProfile(currentUser);
    });

    // ─── تحميل البيانات ──────────────────────────────────────
    function loadProfile(user) {

      // ── Avatar ──
      const avatarImg         = document.getElementById('avatarImg');
      const avatarPlaceholder = document.getElementById('avatarPlaceholder');

      if (user.avatar) {
        avatarImg.src = user.avatar;
        avatarImg.onload = () => {
          avatarImg.classList.remove('hidden');
          avatarPlaceholder.classList.add('hidden');
        };
        avatarImg.onerror = () => {
          avatarPlaceholder.textContent =
            (user.username || '?').charAt(0).toUpperCase();
        };
      } else {
        avatarPlaceholder.textContent =
          (user.username || '?').charAt(0).toUpperCase();
      }

      // ── Card Info ──
      document.getElementById('cardName').textContent =
        user.name || user.username || '—';

      document.getElementById('cardUsername').textContent =
        '@' + (user.username || '—');

      const cardProvider = document.getElementById('cardProvider');
      cardProvider.textContent = user.provider || 'email';

      // لون الـ Provider
      const colors = {
        discord: '#5865F2',
        google:  '#4285F4',
        github:  '#aaaaaa',
        email:   '#00c8e0',
      };
      const c = colors[user.provider] || '#00c8e0';
      cardProvider.style.background = `${c}22`;
      cardProvider.style.color      = c;

      document.getElementById('cardJoined').textContent = user.joined
        ? new Date(user.joined).toLocaleDateString('en-US', {
            year: 'month', month: 'short', day: 'numeric'
          })
        : 'Today';

      document.getElementById('cardEmail').textContent =
        user.email || '—';

      // ── Form Fields ──
      document.getElementById('editUsername').value =
        user.username || '';

      document.getElementById('editName').value =
        user.name || user.username || '';

      document.getElementById('editEmail').value =
        user.email || '';

      // ── Purchases ──
      renderPurchases(
        JSON.parse(localStorage.getItem('nxh_purchases') || '[]')
      );
    }

    // ─── Avatar Upload ───────────────────────────────────────
    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('❌ Please upload an image file', 'error');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showToast('❌ Image must be less than 5MB', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result;

        // Preview
        const avatarImg         = document.getElementById('avatarImg');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');
        avatarImg.src = base64;
        avatarImg.classList.remove('hidden');
        avatarPlaceholder.classList.add('hidden');

        // Save to Supabase
        const result = await Auth.updateProfile({ avatar_url: base64 });
        if (result.success) {
          showToast('✅ Photo updated!');
          await Navbar.build();
          i18n.applyTranslations();
        } else {
          showToast('❌ ' + result.error, 'error');
        }
      };
      reader.readAsDataURL(file);
    }

    // ─── Save Profile ────────────────────────────────────────
    async function saveProfile(e) {
      e.preventDefault();

      const btn      = document.getElementById('saveBtn');
      const username = document.getElementById('editUsername').value.trim();
      const name     = document.getElementById('editName').value.trim();

      if (!username || username.length < 3) {
        showToast('❌ Username must be at least 3 characters', 'error');
        return;
      }

      btn.textContent = '...';
      btn.disabled    = true;

      const result = await Auth.updateProfile({
        username,
        full_name:  name || username,
        user_name:  username,
      });

      if (result.success) {
        // تحديث الكارد
        document.getElementById('cardName').textContent     = name || username;
        document.getElementById('cardUsername').textContent = '@' + username;

        // تحديث اليوزر المحلي
        currentUser.username = username;
        currentUser.name     = name || username;

        showToast('✅ Profile saved!');

        // إعادة بناء الـ Navbar
        await Navbar.build();
        i18n.applyTranslations();
      } else {
        showToast('❌ ' + result.error, 'error');
      }

      btn.textContent = i18n.t('profile_save');
      btn.disabled    = false;
    }

    // ─── Purchases ───────────────────────────────────────────
    function renderPurchases(purchases) {
      const container = document.getElementById('purchasesList');

      if (!purchases || !purchases.length) {
        container.innerHTML = `
          <div class="text-center py-16 text-white/30">
            <div class="text-5xl mb-4">🛒</div>
            <p class="font-semibold"
               data-i18n="profile_no_purchases">No purchases yet</p>
            <a href="${FRONTEND_URL}/store.html"
               class="text-[#00c8e0] text-sm mt-2
                      inline-block hover:text-white transition">
              Browse Store →
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = purchases.map(p => `
        <div class="glass rounded-xl p-4 flex items-center
                    justify-between mb-3">
          <div>
            <div class="font-bold text-sm">${p.product_name}</div>
            <div class="text-white/40 text-xs mt-0.5">
              ${new Date(p.purchased_at).toLocaleDateString()}
            </div>
          </div>
          <div class="text-[#00c8e0] font-black">$${p.price}</div>
        </div>
      `).join('');
    }

    // ─── Tab Switch ──────────────────────────────────────────
    function switchProfileTab(tab) {
      ['info', 'purchases'].forEach(t => {
        document.getElementById(`ptab-${t}`)
          .classList.toggle('active', t === tab);
        document.getElementById(`ptab-${t}-content`)
          .classList.toggle('hidden', t !== tab);
      });
    }

    // ─── Delete Account ──────────────────────────────────────
    async function confirmDelete() {
      const confirmed = confirm(
        'Are you sure you want to delete your account?\nThis cannot be undone.'
      );
      if (!confirmed) return;

      const sb = await getSupabase();
      await sb.auth.signOut();
      localStorage.clear();
      window.location.href = `${FRONTEND_URL}/index.html`;
    }
  </script>

</body>
</html>
