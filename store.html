<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXH Store | المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: #fff; overflow-x: hidden; transition: all 0.3s ease; }
        .glass { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #050505; } ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav data-aos="fade-down" class="sticky top-0 z-50 glass px-8 py-4 m-4 rounded-3xl flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-8 md:gap-12">
            <a href="index.html" class="text-4xl font-black text-cyan-400 tracking-tighter hover:scale-105 transition" style="text-shadow: 0 0 15px #06b6d4;">NXH</a>
            <div class="hidden md:flex gap-8 text-sm font-bold text-gray-400">
                <a href="index.html" data-i18n="nav_home" class="hover:text-cyan-400 transition pb-1">الرئيسية</a>
                <a href="store.html" data-i18n="nav_store" class="text-cyan-400 border-b-2 border-cyan-400 pb-1">المتجر</a>
                <a href="community.html" data-i18n="nav_community" class="hover:text-cyan-400 transition pb-1">المجتمع</a>
                <a href="support.html" data-i18n="nav_support" class="hover:text-cyan-400 transition pb-1">الدعم</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="lang-btn" class="text-gray-400 hover:text-white transition font-black text-sm flex items-center gap-2">🌐 EN</button>
            <a href="login.html" class="hidden md:inline-block bg-cyan-500 text-black px-8 py-3 rounded-full font-black text-sm hover:bg-white transition" data-i18n="btn_login">LOGIN</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-6">
        <div data-aos="zoom-in" class="glass p-12 md:p-20 rounded-[3rem] text-center max-w-2xl border-cyan-500/10 shadow-[0_0_50px_rgba(6,182,212,0.05)]">
            <div class="text-7xl mb-8 animate-pulse">📦</div>
            <h2 data-i18n="store_title" class="text-4xl md:text-5xl font-black mb-6 uppercase tracking-tight text-white">قائمة <span class="text-cyan-500 text-glow">المنتجات</span></h2>
            <p data-i18n="store_desc" class="text-gray-500 text-lg leading-relaxed italic">
                نحن نعمل على تجهيز قائمة منتجات حصرية تليق بمجتمع نكسوريا. ترقبوا الإطلاق قريباً.
            </p>
            
            <div class="mt-10 flex justify-center gap-4">
                <div class="w-2 h-2 bg-cyan-500 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-cyan-500 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-cyan-500 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            </div>
        </div>
    </main>

    <footer data-i18n="footer" class="border-t border-white/5 text-center py-10 text-gray-600 text-xs font-bold tracking-[0.2em] uppercase">
        NXH ECOSYSTEM &copy; 2026 | BUILT & DESIGNED BY SANY
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
    <script src="main.js"></script>
</body>
</html>
