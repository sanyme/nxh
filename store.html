<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store — Nexoria Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    * { font-family: 'Inter', sans-serif; }
    [dir="rtl"] * { font-family: 'Tajawal', sans-serif; }

    .bg-grid {
      background-image:
        linear-gradient(rgba(0,200,224,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,224,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .product-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); transition: all 0.3s; }
    .product-card:hover { border-color: rgba(0,200,224,0.4); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .btn-cyan { background: #00c8e0; color: #000; font-weight: 700; transition: all 0.2s; }
    .btn-cyan:hover { background: #00e5ff; }
    .filter-btn { border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { border-color: #00c8e0; color: #00c8e0; background: rgba(0,200,224,0.1); }
  </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen bg-grid">

  <nav id="mainNav" 
       class="border-b border-white/10 px-8 py-4 flex items-center justify-between 
              sticky top-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-md">
  </nav>
  <div id="mobileMenu" class="hidden md:hidden bg-[#0f0f0f] border-b border-white/10"></div>

  <div class="max-w-7xl mx-auto px-8 py-12">
    <div class="mb-10">
      <h1 class="text-4xl font-black mb-2">
        <span data-i18n="store_title">The</span>
        <span class="text-[#00c8e0]" data-i18n="store_accent"> Store</span>
      </h1>
      <p class="text-white/40" data-i18n="store_desc">340+ products for gamers, by gamers</p>
    </div>

    <!-- Search + Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-10">
      <div class="flex-1 relative">
        <input type="text" data-i18n="store_search" placeholder="Search products..." 
               oninput="filterProducts()" id="searchInput"
               class="w-full bg-white/5 border border-white/10 text-white px-5 py-3 rounded-xl 
                      text-sm focus:outline-none focus:border-[#00c8e0] placeholder-white/30"/>
        <span class="absolute right-4 top-3.5 text-white/30 text-sm">🔍</span>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="setFilter('all', this)" class="filter-btn active px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="filter_all">All</button>
        <button onclick="setFilter('script', this)" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="filter_scripts">Scripts</button>
        <button onclick="setFilter('config', this)" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="filter_configs">Configs</button>
        <button onclick="setFilter('tool', this)" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="filter_tools">Tools</button>
        <button onclick="setFilter('bundle', this)" class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="filter_bundles">Bundles</button>
      </div>
    </div>

    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    <div id="noResults" class="hidden text-center py-20 text-white/30">
      <div class="text-4xl mb-4">🔍</div>
      <p>No products found</p>
    </div>
  </div>

  <footer class="border-t border-white/10 px-8 py-6 flex items-center justify-between text-white/40 text-sm mt-12">
    <span data-i18n="footer_rights">© 2024 Nexoria Hub. All rights reserved.</span>
    <span class="text-[#00c8e0]/40 font-bold">NXH</span>
  </footer>

  <script src="shared.js"></script>
  <script>
    const products = [
      { id: 1, name: 'Pro Aim Config', category: 'config', price: 9.99, badge: 'HOT', badgeColor: '#ff4444', emoji: '🎯', desc: 'Advanced aim configuration for FPS games', downloads: 2341 },
      { id: 2, name: 'Auto Farm Script', category: 'script', price: 14.99, badge: 'NEW', badgeColor: '#00c8e0', emoji: '🤖', desc: 'Automated farming script with anti-ban', downloads: 892 },
      { id: 3, name: 'FPS Booster Tool', category: 'tool', price: 4.99, badge: null, badgeColor: null, emoji: '⚡', desc: 'Optimize your PC for maximum FPS', downloads: 5621 },
      { id: 4, name: 'Ultimate Bundle', category: 'bundle', price: 29.99, badge: 'SALE', badgeColor: '#ff8800', emoji: '📦', desc: 'Everything you need — 15 products included', downloads: 431 },
      { id: 5, name: 'Macro Manager', category: 'tool', price: 7.99, badge: null, badgeColor: null, emoji: '🖱️', desc: 'Create and manage game macros easily', downloads: 1204 },
      { id: 6, name: 'Anti-Recoil Script', category: 'script', price: 12.99, badge: 'HOT', badgeColor: '#ff4444', emoji: '🔫', desc: 'Perfect recoil control for all weapons', downloads: 3872 },
      { id: 7, name: 'Skin Changer', category: 'tool', price: 19.99, badge: 'NEW', badgeColor: '#00c8e0', emoji: '🎨', desc: 'Change in-game skins without restrictions', downloads: 654 },
      { id: 8, name: 'Pro Config Pack', category: 'config', price: 24.99, badge: 'SALE', badgeColor: '#ff8800', emoji: '⚙️', desc: 'Pro player configurations — all games', downloads: 1893 },
    ];

    window._currentProducts = products;
    let currentFilter = 'all';

    function renderProducts(list) {
      window._currentProducts = list;
      const grid = document.getElementById('productsGrid');
      const noResults = document.getElementById('noResults');

      if (!list.length) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      grid.innerHTML = list.map(p => `
        <div class="product-card rounded-2xl p-6 flex flex-col">
          <div class="flex items-start justify-between mb-4">
            <div class="text-4xl">${p.emoji}</div>
            ${p.badge ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full" 
              style="background:${p.badgeColor}22;color:${p.badgeColor};border:1px solid ${p.badgeColor}44">${p.badge}</span>` : ''}
          </div>
          <h3 class="font-bold text-base mb-1">${p.name}</h3>
          <p class="text-white/40 text-xs mb-4 flex-1">${p.desc}</p>
          <div class="text-white/30 text-xs mb-4">📥 ${p.downloads.toLocaleString()} <span data-i18n="downloads">${i18n.t('downloads')}</span></div>
          <div class="flex items-center justify-between">
            <span class="text-[#00c8e0] font-black text-lg">$${p.price}</span>
            <button onclick="addToCart(${p.id})" 
                    class="btn-cyan px-4 py-2 rounded-lg text-xs"
                    data-i18n="buy_now">${i18n.t('buy_now')}</button>
          </div>
        </div>
      `).join('');
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterProducts();
    }

    function filterProducts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchFilter = currentFilter === 'all' || p.category === currentFilter;
        const matchSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });
      renderProducts(filtered);
    }

    function addToCart(id) {
      if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      const product = products.find(p => p.id === id);
      alert(`Added "${product.name}" to cart!`);
    }

    renderProducts(products);
  </script>

</body>
</html>
