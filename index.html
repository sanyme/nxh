<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NXH | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #050505; color: white; }
        .neon { text-shadow: 0 0 15px #06b6d4; }
        .glass { background: rgba(10,10,10,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        #file-upload { display: none; }
    </style>
</head>
<body>
    <nav class="glass fixed top-0 w-full z-50 px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-12">
            <div class="text-3xl font-black neon text-cyan-500 cursor-pointer" onclick="location.href='index.html'">NXH</div>
            <ul class="hidden md:flex gap-8 text-sm font-bold text-gray-400 uppercase tracking-widest">
                <li><a href="index.html" data-i18n="nav_home" class="text-white border-b-2 border-cyan-500 pb-1">Home</a></li>
                <li><a href="store.html" data-i18n="nav_store" class="hover:text-cyan-400 transition">Store</a></li>
                <li><a href="community.html" data-i18n="nav_community" class="hover:text-cyan-400 transition">Community</a></li>
                <li><a href="support.html" data-i18n="nav_support" class="hover:text-cyan-400 transition">Support</a></li>
            </ul>
        </div>
        <div id="auth-section" class="flex items-center gap-4 relative z-[60]">
            <button id="lang-btn" class="bg-white/5 px-3 py-2 rounded-lg text-xs font-black hover:bg-white/10 transition">🌐 AR</button>
            <a href="login.html" id="login-btn" data-i18n="btn_login" class="bg-cyan-500 text-black px-6 py-2 rounded-full font-black text-xs uppercase hover:scale-105 transition">Login</a>
        </div>
    </nav>

    <section class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative z-10">
        <h1 class="text-6xl md:text-8xl font-black uppercase mb-6" data-i18n="title">NEXORIA HUB</h1>
        <div class="flex gap-4">
            <a href="store.html" data-i18n="btn_store" class="bg-white text-black px-10 py-4 rounded-2xl font-black uppercase text-xs hover:bg-cyan-500 transition">Browse Store</a>
            <a href="login.html" id="hero-login-btn" data-i18n="btn_login" class="bg-white/5 border border-white/10 px-10 py-4 rounded-2xl font-black uppercase text-xs hover:bg-white/10 transition">Login</a>
        </div>
    </section>

    <div id="settings-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl hidden z-[100] flex items-center justify-center p-6 text-right">
        <div class="bg-[#0a0a0a] border border-white/10 p-8 rounded-[3rem] w-full max-w-md shadow-2xl relative">
            <h2 class="text-3xl font-black neon uppercase italic text-center mb-8">Profile <span class="text-cyan-500">Settings</span></h2>
            <div class="flex flex-col gap-6 items-center">
                <div class="relative group cursor-pointer" onclick="document.getElementById('file-upload').click()">
                    <img id="modal-preview" src="" class="w-24 h-24 rounded-full border-4 border-cyan-500 object-cover shadow-lg">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-[10px] font-black uppercase">Change Photo</div>
                </div>
                <input type="file" id="file-upload" accept="image/*" onchange="previewFile()">
                <div class="w-full">
                    <label class="text-[10px] text-gray-500 font-black uppercase mr-2 tracking-widest">Display Name</label>
                    <input type="text" id="edit-username" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-white outline-none focus:border-cyan-500 transition font-bold text-right">
                    <input type="hidden" id="edit-avatar">
                </div>
                <div class="flex flex-col gap-3 w-full">
                    <button onclick="saveProfile()" class="bg-cyan-500 text-black font-black py-4 rounded-2xl uppercase text-sm hover:scale-105 transition">Save Changes</button>
                    <button onclick="toggleSettings()" class="text-gray-500 font-black text-xs uppercase text-center hover:text-white transition">Cancel</button>
                    <button onclick="logout()" class="text-red-500/40 font-black text-[10px] uppercase text-center mt-4 hover:text-red-500 transition">Logout</button>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
